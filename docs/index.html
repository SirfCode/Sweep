<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Seep Support</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #14231d;
      --muted: #52645c;
      --felt: #0f6b45;
      --line: #d8e3dd;
      --paper: #ffffff;
      --wash: #f5faf7;
    }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.6;
      color: var(--ink);
      background: var(--wash);
    }
    main {
      max-width: 760px;
      margin: 0 auto;
      padding: 48px 20px;
    }
    header {
      border-bottom: 4px solid var(--felt);
      margin-bottom: 28px;
      padding-bottom: 18px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 36px;
    }
    p {
      margin: 0 0 16px;
    }
    a {
      color: var(--felt);
      font-weight: 700;
    }
    nav {
      display: grid;
      gap: 12px;
      margin-top: 24px;
    }
    nav a {
      display: block;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--paper);
      text-decoration: none;
    }
    .muted {
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Seep Support</h1>
      <p class="muted">Support pages for Seep by SirfCode.</p>
    </header>
    <p>Seep is a single-player card game where you can play anonymously or sign in with Google to save completed game reports.</p>
    <nav aria-label="Support links">
      <a href="privacy-policy.html">Privacy Policy</a>
      <a href="account-deletion.html">Account and Data Deletion</a>
    </nav>
  </main>
</body>
</html>
