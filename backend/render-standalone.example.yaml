# Optional standalone alternative only. Production shares the What's for Dinner
# service and database; do not deploy this example for the shared setup.
services:
  - type: web
    name: seep-api
    runtime: node
    plan: free
    region: ohio
    branch: master
    rootDir: backend
    buildCommand: npm ci --omit=dev
    # Startup migrations also work on free web services (no pre-deploy hook).
    startCommand: npm run migrate && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # Existing same-region database URL; creates no database.
      - key: ADMIN_API_KEY
        sync: false
      - key: SEEP_UPLOAD_API_KEY
        sync: false
