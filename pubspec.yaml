name: sweep
description: Offline partnership Seep with one human and three bots.
publish_to: none
version: 0.7.0+7

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  fonts:
    - family: NotoDevanagari
      fonts:
        - asset: assets/fonts/NotoSansDevanagari.ttf
  assets:
    - SEEP_RULES.md
    - SEEP_RULES_HI.md
    - assets/fonts/OFL-NotoSansDevanagari.txt
