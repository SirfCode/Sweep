name: sweep
description: Offline partnership Seep with one human and three bots.
publish_to: none
version: 0.12.0+12

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  audioplayers: ^6.8.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  google_sign_in: ^7.2.0
  http: ^1.6.0
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5
  uuid: ^4.6.0
  web: ^1.1.1

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  fonts:
    - family: NotoDevanagari
      fonts:
        - asset: assets/fonts/NotoSansDevanagari.ttf
  assets:
    - assets/audio/sfx/
    - assets/help/
    - assets/fonts/OFL-NotoSansDevanagari.txt
